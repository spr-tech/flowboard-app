<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowboard sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
.fb-nav{transition:background .2s,color .2s}
.fb-nav:hover{background:rgba(251,245,238,.08)}
</style>
</helmet>
<nav aria-label="Main" style="font-family: Inter, system-ui, sans-serif; width: 240px; height: 100%; min-height: 100vh; box-sizing: border-box; background: #1E1512; color: #F6EDE4; padding: 24px 16px; display: flex; flex-direction: column; gap: 32px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F6EDE4; padding: 0 8px">
<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="#FBF5EE"></rect><rect x="7" y="7" width="4" height="16" rx="2" fill="#D23F27"></rect><rect x="13" y="7" width="4" height="11" rx="2" fill="#1E1512"></rect><rect x="19" y="7" width="4" height="7" rx="2" fill="#D4F04A"></rect></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em">Flowboard</span>
</a>

<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="3">
<sc-if value="{{item.active}}" hint-placeholder-val="{{ false }}">
<a href="{{item.href}}" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: #D4F04A; color: #1E1512; text-decoration: none; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>{{item.label}}</a>
</sc-if>
<sc-if value="{{item.idle}}" hint-placeholder-val="{{ true }}">
<a class="fb-nav" href="{{item.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 999px; color: #BFAEA3; text-decoration: none; font-size: 15px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>{{item.label}}</a>
</sc-if>
</sc-for>
</div>

<div>
<p style="margin: 0 0 10px; padding: 0 14px; font-size: 12px; font-weight: 600; color: #BFAEA3; letter-spacing: 0.04em; text-transform: uppercase">Your projects</p>
<div style="display: flex; flex-direction: column; gap: 2px">
<a class="fb-nav" href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 14px; border-radius: 12px; color: #F6EDE4; text-decoration: none; font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #4F8BE0"></span>Capstone: FoodBridge<svg width="12" height="12" viewBox="0 0 24 24" fill="#D4F04A" stroke="#D4F04A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Pinned" role="img" style="margin-left: auto"><path d="M15 4.5l4.5 4.5-3 1.5-3.5 3.5-.5 3.5L4 9.5l3.5-.5L11 5.5l1.5-3z"></path><path d="M8.5 15.5L4 20" fill="none"></path></svg></a>
<a class="fb-nav" href="Board.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 14px; border-radius: 12px; color: #F6EDE4; text-decoration: none; font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #D23F27"></span>Website relaunch</a>
<a class="fb-nav" href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 14px; border-radius: 12px; color: #F6EDE4; text-decoration: none; font-size: 14px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #D4F04A"></span>Mobile app MVP</a>
</div>
</div>

</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","projects","settings"],"default":"dashboard"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const nav = [
      { key: 'dashboard', label: 'Dashboard', href: 'Dashboard.dc.html', d: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
      { key: 'projects', label: 'Projects', href: 'Projects.dc.html', d: 'M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z' },
      { key: 'settings', label: 'Settings', href: 'Settings.dc.html', d: 'M4 7h9M17 7h3M15 5v4M4 17h3M11 17h9M9 15v4' }
    ];
    return {
      items: nav.map((n) => ({ ...n, active: n.key === active, idle: n.key !== active }))
    };
  }
}
</script>
</body>
</html>
