# CI: lint, typecheck, test and build on every push, and on pull requests into rebuild and master.
# Deploys stay with Vercel's Git integration (preview links per branch); this workflow only checks.
# Make "check" a required status check on rebuild and master so a red run blocks merging.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [rebuild, master]

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dummy values, not secrets. ".invalid" can never resolve, so CI can't reach Neon or any
    # other database even by mistake. Tests set their own values in vitest.config.mts.
    env:
      DATABASE_URL: postgresql://ci:ci@db.invalid:5432/flowboard
      DIRECT_URL: postgresql://ci:ci@db.invalid:5432/flowboard
      AUTH_SECRET: ci-dummy-secret-not-used-anywhere-real
      AUTH_GITHUB_ID: ci-dummy-github-id
      AUTH_GITHUB_SECRET: ci-dummy-github-secret
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Reads the exact pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
